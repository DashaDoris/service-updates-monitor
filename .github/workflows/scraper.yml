name: Service Updates Scraper
on:
  schedule:
   - cron: '26 13 * * *'   # ТИМЧАСОВО для тесту — прибрати після перевірки
    - cron: '0 8 * * 1'     # бойовий: щопонеділка 08:00 UTC
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore seen hashes cache
        uses: actions/cache@v4
        with:
          path: seen_hashes.json
          key: seen-hashes-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            seen-hashes-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run scraper
        continue-on-error: true
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          CODA_API_TOKEN: ${{ secrets.CODA_API_TOKEN }}
        run: python scraper.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-results
          path: results.json
